<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таблица Лапок</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Таблица Лапок</h1>

    <nav class="tabs" aria-label="Категории таблицы">
      <button class="tab active" data-category="Потные">Потные</button>
      <button class="tab" data-category="Мега">Мега</button>
      <button class="tab" data-category="Сломанные">Сломанные</button>
      <button class="tab" data-category="Предложения">Предложения</button>
    </nav>

    <a
      class="button suggest-button"
      href="https://github.com/Varkenor/OE_Games_Lapki/issues/new?template=suggestion.yml"
      target="_blank"
      rel="noopener"
    >Предложить свои</a>

    <section class="controls" aria-label="Поиск и сортировка">
      <input id="search" type="search" placeholder="Поиск по играм…">
      <select id="sort" aria-label="Сортировка">
        <option value="name-asc">Название: 1–9, А–Я</option>
        <option value="name-desc">Название: 9–1, Я–А</option>
        <option value="points-asc">Баллы: по возрастанию</option>
        <option value="points-desc">Баллы: по убыванию</option>
      </select>
    </section>

    <p class="hint">Нажмите на строку, чтобы отметить её выполненной. Отметка сохраняется в этом браузере.</p>

    <div class="table-wrap">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
      <p id="empty-message" class="empty" hidden>В этой категории пока нет записей.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
