name: Add approved proposal to site

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  add-proposal:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository files
        uses: actions/checkout@v4

      - name: Add approved proposal to data.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            if (context.payload.label.name !== "approved") {
              core.info("Это не метка approved — пропускаю.");
              return;
            }

            const issue = context.payload.issue;
            const body = issue.body || "";

            const fields = Object.fromEntries(
              body.split(/\r?\n### /).slice(1).map(section => {
                const lines = section.split(/\r?\n/);
                return [lines[0].trim(), lines.slice(1).join("\n").trim()];
              })
            );

            const game = fields["Игра"];
            const requirement = fields["Требование"];
            const category = fields["Категория"];
            const points = Number(fields["Предложенное количество баллов"]);

            const allowedCategories = ["Потные", "Мега", "Сломанные"];

            if (!game || !requirement || !allowedCategories.includes(category) ||
                !Number.isInteger(points) || points < 0) {
              core.setFailed("В Issue не заполнено обязательное поле или указана неверная категория/сумма баллов.");
              return;
            }

            const file = "data.json";
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            data.challenges ||= [];
            data.proposals ||= [];

            const id = `issue-${issue.number}`;

            if (data.challenges.some(item => item.id === id)) {
              core.info("Это предложение уже добавлено.");
              return;
            }

            const entry = {
              id,
              game,
              requirement,
              category,
              points,
              status: "Принято",
              issueUrl: issue.html_url
            };

            data.challenges.push(entry);
            data.proposals.push(entry);

            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: "closed"
            });

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Новых изменений нет."
            exit 0
          fi
          git commit -m "Add approved proposal"
          git push
