name: Предложение для таблицы
description: Предложить игру или испытание
title: "Предложение: "
labels: ["предложение"]
body:
  - type: input
    id: game
    attributes:
      label: Игра
      placeholder: Название игры
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: Требование
      placeholder: Что нужно выполнить?
    validations:
      required: true

  - type: input
    id: points
    attributes:
      label: Кол-во баллов
      placeholder: "Например: 10"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Категория
      options:
        - Потные
        - Мега
        - Трудные
    validations:
      required: true
