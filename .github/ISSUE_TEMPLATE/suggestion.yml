name: Предложение для таблицы
description: Предложить игру или испытание
title: "Предложение: "
labels: ["предложение"]
body:
  - type: input
    id: nickname
    attributes:
      label: Ник
      placeholder: Имя пользователя в дискорде (не на сервере), который будет отображаться в таблице.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Где найти:**

        ![Где найти:](https://raw.githubusercontent.com/Varkenor/OE_Games_Lapki/main/image.png)

  - type: input
    id: game
    attributes:
      label: Игра
      placeholder: "Название игры:"
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: Требование
      description: Коротко, как в таблице. Подробности - в поле "Описание" ниже.
      placeholder: "Например: 90% достижений + достижение \"Ничего себе техника!\""
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Почему испытание сложное, что нужно учесть. В таблицу не попадает, его читают только при рассмотрении.
      placeholder: Например, достижение доступно только в NG+, часть ачивок требует локального коопа…
    validations:
      required: false

  - type: input
    id: points
    attributes:
      label: Кол-во баллов
      placeholder: "Например: 10"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Максимум баллов в категории:**
        - Потные: до 10
        - Мега: до 50
        - Сломанные: до 500


  - type: dropdown
    id: category
    attributes:
      label: Категория
      options:
        - Потные
        - Мега
        - Сломанные
    validations:
      required: true
