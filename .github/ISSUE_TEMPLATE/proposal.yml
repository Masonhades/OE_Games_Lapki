name: Предложить лапки
description: Отправить новые лапки для таблицы
title: "[Предложение]: "
labels: ["предложение"]
body:
  - type: input
    id: game
    attributes:
      label: Игра
      placeholder: Название игры
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: Требование
      description: Что нужно выполнить в игре?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Категория
      description: Выберите категорию сами; при проверке её могут изменить.
      options:
        - Потные
        - Мега
        - Сломанные
    validations:
      required: true

  - type: input
    id: points
    attributes:
      label: Предложенное количество баллов
      placeholder: Например, 25
    validations:
      required: true
